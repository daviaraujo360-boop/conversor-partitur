<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Áudio & Partitura (com IA)</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f0f2f5; color: #1c1e21; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; width: 100%; max-width: 850px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #1877f2; margin-bottom: 20px; }
        .section { background: #f7f8fa; border: 1px solid #e4e6eb; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        input[type="file"], button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px; }
        button { background: #1877f2; color: white; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: #166fe5; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        #statusMsg { font-weight: bold; color: #1877f2; margin-top: 10px; text-align: center; display: none; }
        #paper { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-top: 10px; display: flex; justify-content: center; overflow-x: auto; min-height: 150px; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Conversor de Áudio & Partitura (IA)</h1>

    <div class="section">
        <label for="audioInput">1. Subir Áudio (Voz / Instrumento)</label>
        <input type="file" id="audioInput" accept="audio/*">
        <audio id="audioPlayer" controls></audio>
        <button id="processAudioBtn" disabled>🤖 Transcrever Áudio com IA</button>
        <div id="statusMsg">Processando áudio com a IA...</div>
    </div>

    <div class="section">
        <label>2. Partitura Real Gerada</label>
        <div id="paper"></div>
        <button id="downloadScoreBtn" disabled>💾 Baixar Partitura (PNG)</button>
    </div>
</div>

<script>
    const API_URL = "https://api-conversor-partitura.onrender.com";

    const audioInput = document.getElementById('audioInput');
    const audioPlayer = document.getElementById('audioPlayer');
    const processAudioBtn = document.getElementById('processAudioBtn');
    const downloadScoreBtn = document.getElementById('downloadScoreBtn');
    const statusMsg = document.getElementById('statusMsg');
    const paper = document.getElementById('paper');

    let currentFile = null;

    audioInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            currentFile = file;
            audioPlayer.src = URL.createObjectURL(file);
            processAudioBtn.disabled = false;
        }
    });

    function midiToVexKey(midi) {
        const noteNames = ["c", "c#", "d", "d#", "e", "f", "f#", "g", "g#", "a", "a#", "b"];
        const octave = Math.floor(midi / 12) - 1;
        const name = noteNames[midi % 12];
        return `${name}/${octave}`;
    }

    processAudioBtn.addEventListener('click', async () => {
        if (!currentFile) return;

        processAudioBtn.disabled = true;
        statusMsg.style.display = 'block';
        statusMsg.innerText = "Enviando para a IA no servidor e analisando frequências...";
        paper.innerHTML = '';

        const formData = new FormData();
        formData.append('file', currentFile);

        try {
            const response = await fetch(`${API_URL}/convert`, {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success && data.notes && data.notes.length > 0) {
                statusMsg.innerText = `Sucesso! ${data.total_notes} notas detectadas pela IA. Desenhando partitura...`;
                renderScore(data.notes.slice(0, 8));
                downloadScoreBtn.disabled = false;
            } else {
                statusMsg.innerText = "Nenhuma nota clara foi detectada no áudio.";
            }
        } catch (error) {
            console.error(error);
            statusMsg.innerText = "Erro ao conectar com a API de IA.";
        } finally {
            processAudioBtn.disabled = false;
        }
    });

    function renderScore(notesData) {
        paper.innerHTML = ''; 
        const { Renderer, Stave, StaveNote, Voice, Formatter } = Vex.Flow;
        
        const renderer = new Renderer(paper, Renderer.Backends.SVG);
        renderer.resize(700, 150);
        const context = renderer.getContext();
        const stave = new Stave(10, 10, 650);

        stave.addClef("treble").addTimeSignature("4/4");
        stave.setContext(context).draw();

        const vexNotes = notesData.map(n => {
            const key = midiToVexKey(n.pitch);
            try {
                return new StaveNote({ keys: [key], duration: "q" });
            } catch (err) {
                return new StaveNote({ keys: ["c/4"], duration: "q" });
            }
        });

        if (vexNotes.length > 0) {
            const voice = new Voice({ num_beats: vexNotes.length, beat_value: 4 });
            voice.addTickables(vexNotes);
            
            new Formatter().joinVoices([voice]).format([voice], 500);
            voice.draw(context, stave);
        }
    }

    downloadScoreBtn.addEventListener('click', () => {
        const svgElement = paper.querySelector('svg');
        if (!svgElement) return;

        const svgData = new XMLSerializer().serializeToString(svgElement);
        const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
        const URLObj = window.URL || window.webkitURL || window;
        const blobURL = URLObj.createObjectURL(svgBlob);

        const img = new Image();
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = svgElement.clientWidth || 700;
            canvas.height = svgElement.clientHeight || 150;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);

            canvas.toBlob((blob) => {
                const downloadUrl = URLObj.createObjectURL(blob);
                const a = document.createElement('a');
                a.download = 'partitura-ia.png';
                a.href = downloadUrl;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URLObj.revokeObjectURL(downloadUrl);
            }, 'image/png');
        };
        img.src = blobURL;
    });
</script>

</body>
</html>
